<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <div class="header-content">
            <h1>Product Review Form</h1>
        </div>
    </header>
    <main>
        <form action="review.html" method="get">
            
            <div class="form-group">
                <label for="product-select">Product Name:</label>
                <select id="product-select" name="product_name" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>

            <div class="form-group">
                <label>Overall Rating:</label>
                <div class="rating-group">
                    <input type="radio" id="rating-1" name="overall_rating" value="1" required>
                    <label for="rating-1">☆</label>

                    <input type="radio" id="rating-2" name="overall_rating" value="2" required>
                    <label for="rating-2">☆☆</label>

                    <input type="radio" id="rating-3" name="overall_rating" value="3" required>
                    <label for="rating-3">☆☆☆</label>

                    <input type="radio" id="rating-4" name="overall_rating" value="4" required>
                    <label for="rating-4">☆☆☆☆</label>

                    <input type="radio" id="rating-5" name="overall_rating" value="5" required>
                    <label for="rating-5">☆☆☆☆☆</label>
                </div>
            </div>

            <div class="form-group">
                <label for="install-date">Date of Installation:</label>
                <input type="date" id="install-date" name="installation_date" required>
            </div>

            <div class="form-group">
                <label>Useful Features (Check all that apply):</label>
                
                <div class="checkbox-item">
                    <input type="checkbox" id="feature-durability" name="features" value="durability">
                    <label for="feature-durability">Durability</label>
                </div>

                <div class="checkbox-item">
                    <input type="checkbox" id="feature-ease-of-use" name="features" value="ease_of_use">
                    <label for="feature-ease-of-use">Ease of Use</label>
                </div>
                
                <div class="checkbox-item">
                    <input type="checkbox" id="feature-performance" name="features" value="performance">
                    <label for="feature-performance">Performance</label>
                </div>
                
                <div class="checkbox-item">
                    <input type="checkbox" id="feature-design" name="features" value="design">
                    <label for="feature-design">Modern Design</label>
                </div>
            </div>

            <div class="form-group">
                <label for="written-review">Written Review (Optional):</label>
                <textarea id="written-review" name="written_review" rows="4"></textarea>
            </div>

            <div class="form-group">
                <label for="user-name">User Name (Optional):</label>
                <input type="text" id="user-name" name="user_name">
            </div>

            <div class="form-group">
                <input type="submit" value="Submit Review" class="btn-submit">
            </div>

        </form>
    </main>
    <footer>
        <p class="copyright">©</p>
        <p class="name"><span id="currentyear"></span> - Pedro Ribeiro - Montes Claros/MG</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
