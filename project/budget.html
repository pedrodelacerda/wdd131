<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxel Forge 3D - Budget</title>
    <meta name="author" content="Pedro Ribeiro">
    <meta name="description"
      content="Pedro Ribeiro's BYU-Idaho - WDD 131">
    <link rel="stylesheet" href="styles/">
    <script src="scripts/" defer></script>
</head>
<body>
    <header>
        <nav class="navigation">
            <img src="images/" alt="Logo">
            <ul>
                <li><a href="">Home</a></li>
                <li><a href="">Catalog</a></li>
                <li><a href="">Requests and Contact</a></li>
                <li><a href="">Links</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="title-budget">
            <h1>Project Budget</h1>
            <img src="images/" alt="budget-image">
        </div>
        <section class="quote-form">
            <fieldset class="personal-info">
                <legend>Personal Information</legend>
                <label for="first-name">First Name:</label>
                <input type="text" id="first-name" name="first-name" required>
                <label for="last-name">Last Name:</label>
                <input type="text" id="last-name" name="last-name" required>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" required>
            </fieldset>
            <fieldset class="project-details">
                <legend>Project Details</legend>
                <label for="choose-niche">Choose a Niche:</label>
                <select id="choose-niche" name="choose-niche" required>
                    <option value="others">Select a niche</option>
                    <option value="geek">Geek Models</option>
                    <option value="engineering">Engineering Models</option>
                </select>
                <label for="material-select">Select Material:</label>
                <select id="material-select" name="material-select" required>
                    <option value="pla">PLA</option>
                    <option value="abs">ABS</option>
                    <option value="petg">PETG</option>
                    <option value="asa">ASA</option>
                    <option value="tpu">TPU</option>
                </select>
            </fieldset>
        </section>
    </main>
    <footer>
        <p>©<span id="currentyear"></span> - Pedro Ribeiro - Montes Claros/MG</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
